<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Cam Effects</title>
  <style>
    :root {
      --bg: #000;
      --fg: #e6e6e6;
      --muted: #8a8a8a;
      --accent: #50dc78;
      --panel: rgba(12, 12, 12, 0.72);
      --border: rgba(255, 255, 255, 0.14);
      --rec: #ff4d4d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font: 14px/1.4 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #out { max-width: 100%; max-height: 100%; display: block; }
    video { display: none; }

    .panel {
      background: var(--panel); border: 1px solid var(--border);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
    }
    #bar {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center;
      width: max-content; max-width: calc(100vw - 32px);
      padding: 6px;
      transition: opacity .3s;
    }
    #bar.hidden, #help.hidden { opacity: 0; pointer-events: none; }
    #fx-controls { display: contents; }
    button, select {
      font: inherit; color: var(--fg); background: transparent;
      border: 1px solid transparent; border-radius: 9px;
      padding: 8px 12px; min-height: 40px; cursor: pointer;
    }
    select { border-color: var(--border); background: rgba(0, 0, 0, .35); }
    select option { background: #111; }
    button:hover { border-color: var(--border); }
    button.active { border-color: var(--accent); color: var(--accent); }
    button.rec { color: var(--rec); border-color: var(--rec); }
    .sep { width: 1px; align-self: stretch; background: var(--border); margin: 4px 2px; }

    #help {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: calc(34px + env(safe-area-inset-top));
      width: max-content; max-width: min(520px, calc(100vw - 32px));
      padding: 12px 16px; font-size: 13px; line-height: 1.55;
      transition: opacity .4s;
    }
    #help b { color: var(--accent); font-weight: 500; }

    #start {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 16px; text-align: center; background: var(--bg);
    }
    #start h1 { margin: 0; font-size: 28px; font-weight: 500; letter-spacing: .04em; }
    #start p { margin: 0; color: var(--muted); max-width: 420px; }
    #start button:disabled { opacity: .5; cursor: default; }
    #start button {
      border-color: var(--accent); color: var(--accent);
      padding: 12px 22px; font-size: 16px;
    }
    #status {
      position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); color: var(--muted); font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"><canvas id="out"></canvas></div>
  <video id="video" playsinline muted></video>

  <div id="bar" class="panel hidden">
    <select id="effect" aria-label="Effet"></select>
    <div id="fx-controls"></div>
    <span class="sep"></span>
    <button id="btn-help" title="Aide (?)">?</button>
    <button id="btn-flip" title="Caméra avant / arrière">⟲</button>
    <button id="btn-rec" title="Enregistrer">●</button>
  </div>

  <div id="help" class="panel hidden"></div>

  <div id="start">
    <h1>Cam Effects</h1>
    <p>Effets webcam en temps réel : Blob Art, Chakra, Multi-Clone, Ninjutsu, Shape Control.
       Tout tourne dans ton navigateur, rien n'est envoyé.</p>
    <button id="btn-start" disabled>Chargement…</button>
  </div>
  <div id="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
