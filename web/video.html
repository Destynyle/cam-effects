<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Cam Effects Vidéo</title>
  <style>
    :root {
      --bg: #000;
      --fg: #e6e6e6;
      --muted: #8a8a8a;
      --dim: #555;
      --accent: #50dc78;
      --panel: #0d0d0d;
      --border: rgba(255, 255, 255, 0.14);
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.5 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: .04em; }
    h2 { font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 32px 0 12px; }
    a { color: var(--muted); }
    a:hover { color: var(--fg); }

    #drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      min-height: 140px; padding: 20px; text-align: center; cursor: pointer;
      border: 1px dashed var(--border); border-radius: 14px; background: var(--panel);
      transition: border-color .2s;
    }
    #drop:hover, #drop.over { border-color: var(--accent); }
    #drop b { font-weight: 500; }
    #drop small { color: var(--muted); }
    #file { display: none; }
    #file-info { color: var(--muted); margin-top: 10px; min-height: 1.5em; overflow-wrap: anywhere; }

    .effects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--panel); }
    .card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 500; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { position: relative; }
    .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .chip span {
      display: inline-block; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); user-select: none;
    }
    .chip input:checked + span { border-color: var(--accent); color: var(--accent); }
    .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    .options { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }
    label.opt { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    input[type="checkbox"] { accent-color: var(--accent); }
    select, button {
      font: inherit; color: var(--fg); background: var(--panel);
      border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; min-height: 40px;
    }
    button { cursor: pointer; }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }

    #preview { display: none; margin-top: 24px; }
    #preview canvas { display: block; max-width: 100%; max-height: 60vh; margin: 0 auto; border-radius: 10px; background: #111; }

    #jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    #jobs li {
      display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--panel);
    }
    #jobs .name { overflow-wrap: anywhere; }
    #jobs .state { color: var(--muted); text-align: right; white-space: nowrap; }
    #jobs .bar { grid-column: 1 / -1; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
    #jobs .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    #jobs li.error .state { color: var(--err); }
    #jobs li.done .bar { display: none; }
    #jobs a.dl { color: var(--accent); }
    .note { color: var(--dim); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Cam Effects · Vidéo</h1>
      <a href="./">← caméra en direct</a>
    </header>

    <label id="drop" for="file">
      <b>Dépose une vidéo ici</b>
      <small>ou clique pour choisir un fichier — elle reste sur ton appareil, rien n'est envoyé</small>
    </label>
    <input id="file" type="file" accept="video/*">
    <div id="file-info"></div>

    <h2>Effets à appliquer</h2>
    <div class="effects" id="effects"></div>

    <h2>Options</h2>
    <div class="options">
      <label class="opt">Résolution
        <select id="res">
          <option value="0">Originale</option>
          <option value="1080">1080p</option>
          <option value="720" selected>720p</option>
          <option value="480">480p</option>
        </select>
      </label>
      <label class="opt"><input type="checkbox" id="audio" checked> Garder le son</label>
    </div>
    <p class="note">Chaque version est une vidéo séparée. Plus la résolution est basse, plus le rendu est rapide.</p>

    <div class="actions">
      <button class="primary" id="btn-render" disabled>Choisis une vidéo</button>
      <button id="btn-cancel" disabled>Annuler</button>
    </div>

    <div id="preview"></div>

    <h2 id="jobs-title" hidden>Rendus</h2>
    <ul id="jobs"></ul>
  </main>

  <script type="module" src="video.js"></script>
</body>
</html>
